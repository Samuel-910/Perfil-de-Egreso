site_name: Perfil de Egreso — Ingeniería de Sistemas
site_description: Documentos oficiales del perfil de egreso (ciclo 10) — ERP «Articulos», Salud Total SAC
site_url: https://samuel-910.github.io/Perfil-de-Egreso/
repo_url: https://github.com/Samuel-910/Perfil-de-Egreso
repo_name: Samuel-910/Perfil-de-Egreso
edit_uri: ""

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/weather-night, name: Modo oscuro}
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/weather-sunny, name: Modo claro}
  icon:
    logo: material/book-education
  features:
    - navigation.top
    - navigation.indexes
    - navigation.sections
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Inicio: index.md
  - 'CE01: Gestión de Tecnologías de Información':
    - ce01/index.md
    - 'CE0111-CE0115 - E1: Diagnóstico Organizacional': ce01/e1/index.md
    - 'CE0113 - E2: Business Case del Proyecto': ce01/e2/index.md
    - 'CE0121-CE0125 - E3: Plan de Gestión del Proyecto': ce01/e3/index.md
    - 'CE0131-CE0135 - E4: Modelado de Procesos AS-IS / TO-BE': ce01/e4/index.md
    - 'CE0141-CE0145 - E5: Propuesta de Solución TIC': ce01/e5/index.md
  - 'CE02: Ingeniería de Software':
    - ce02/index.md
    - 'CE021 - S1 - E1: Requerimientos y Diseño del Sistema':
      - ce02/ce021/index.md
      - Galería del prototipo: ce02/ce021/galeria.md
    - 'CE022 - S2 - E2: Plataforma de Datos del Sistema': ce02/ce022/index.md
    - 'CE023 - S2 - E3: Sistema de Software Funcional Integrado': ce02/ce023/index.md
    - 'CE024 - S2 - E4: Gestión del Proyecto y Calidad de Software': ce02/ce024/index.md
  - 'CE03: Infraestructura Tecnológica':
    - ce03/index.md
    - 'CE0311 - S1 - E1: Análisis y Diseño de Red': ce03/ce0311/index.md
    - 'CE0331 - S1 - E2: Análisis y Diseño de Centro de Datos Híbrido': ce03/ce0331/index.md
    - 'CE0321-CE0324 - S2 - E1: Planificación e Implementación del SGSI': ce03/ce0321/index.md
    - 'CE0312-CE0313 - S2 - E2: Implementación, Testing y Monitoreo de Red': ce03/ce0312/index.md
    - 'CE0332-CE0333 - S2 - E3: Implementación, Gestión y Control de Centro de Datos': ce03/ce0332/index.md
